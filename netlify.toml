[build]
  publish = "client/dist"
  command = "cd client && npm install && npm run build && cd ../netlify/functions && npm install"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
